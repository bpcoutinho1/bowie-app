<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, notranslate, noai, noimageai">
  <title>Bowie</title>
  <link rel="icon" href="brand/bowie-symbol.svg" type="image/svg+xml">
  <link rel="stylesheet" href="tokens.css">
  <link rel="stylesheet" href="ficha/ficha.css">
  <script>
    // Links from the app are the root with the token after the "#": open the
    // sheet. The "#" part is never sent to the server.
    if (/^#[A-Za-z0-9_-]{32,64}$/.test(location.hash)) {
      location.replace('ficha/' + location.hash);
    }
  </script>
</head>
<body>
  <main class="page center">
    <picture>
      <source srcset="brand/bowie-lockup-vertical-tagline-negative.svg" media="(prefers-color-scheme: dark)">
      <img class="lockup" src="brand/bowie-lockup-vertical-tagline.svg" alt="Bowie. Quem ama, lembra." width="180">
    </picture>
    <p class="muted">O app para registrar a vida do pet e dividir o cuidado com quem você confia.</p>
  </main>
</body>
</html>
