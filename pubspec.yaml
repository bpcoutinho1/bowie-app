name: bowie
description: "A small app for people who share the care of a pet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^17.5.0
  local_auth: ^3.0.2
  path: ^1.9.1
  sqflite: ^2.4.4
  supabase_flutter: ^2.18.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

# Icon and splash from design/brand/app-icon. Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "design/brand/app-icon/icon-1024.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#6FA8DC"
  adaptive_icon_foreground: "design/brand/app-icon/adaptive-foreground-1024.png"
  # The foreground already keeps the face inside the adaptive safe zone.
  adaptive_icon_foreground_inset: 0

flutter_native_splash:
  color: "#F4F6F8"
  image: "design/brand/app-icon/splash-icon-1024.png"
  android_12:
    color: "#F4F6F8"
    # Android 12+ crops the splash icon to a circle; the adaptive
    # foreground already keeps the face inside that safe zone.
    image: "design/brand/app-icon/adaptive-foreground-1024.png"
  web: false
