name: bowie
description: "A small app for people who share the care of a pet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  connectivity_plus: ^7.3.1
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  # Pinned: the system contact picker, no permission to read the agenda.
  flutter_native_contact_picker: 0.0.12
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^17.5.0
  image_picker: ^1.2.4
  local_auth: ^3.0.2
  local_auth_android: ^2.2.0
  local_auth_darwin: ^2.0.4
  lucide_icons_flutter: ^3.1.21
  open_filex: ^4.7.0
  path: ^1.9.1
  path_provider: ^2.1.6
  purchases_flutter: ^10.16.0
  qr_flutter: ^4.1.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  sqflite: ^2.4.4
  supabase_flutter: ^2.18.0
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.3
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - design/brand/logo/bowie-lockup-vertical.svg
    - design/brand/logo/bowie-lockup-vertical-negative.svg
  fonts:
    # Static instances of the Figtree variable font (OFL, see assets/fonts/OFL.txt).
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800

# Icon and splash from design/brand/app-icon. Regenerate with:
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
flutter_launcher_icons:
  image_path: "design/brand/app-icon/icon-1024.png"
  ios: true
  remove_alpha_ios: true
  android: "ic_launcher"
  min_sdk_android: 24
  adaptive_icon_background: "#6FA8DC"
  adaptive_icon_foreground: "design/brand/app-icon/adaptive-foreground-1024.png"
  # The foreground already keeps the face inside the adaptive safe zone.
  adaptive_icon_foreground_inset: 0

# Splash images come from scripts/make-splash.py (lockup with the tagline).
flutter_native_splash:
  color: "#F4F6F8"
  image: "design/brand/app-icon/splash-lockup.png"
  android_12:
    color: "#F4F6F8"
    # Android 12+ only shows an icon, cropped to a circle; the adaptive
    # foreground keeps the face inside that safe zone. "bowie" and the
    # tagline go in the branding area at the bottom.
    image: "design/brand/app-icon/adaptive-foreground-1024.png"
    branding: "design/brand/app-icon/splash-branding-android12.png"
  web: false
